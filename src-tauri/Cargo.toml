[package]
name = "qlygocad"
version = "1.1.100"
description = "QlygoCAD : CAO 2D pour l'urbanisme"
authors = ["QLYGO"]
edition = "2021"
rust-version = "1.77.2"

# Binaire unique (shell desktop). Tout le dessin vit côté web (engine/*).
[[bin]]
name = "qlygocad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Requêtes HTTP natives (contourne le CORS du navigateur) — login QLYGO + ouverture dossiers.
# ⚠️ ÉPINGLÉ à 2.8.3 : la 2.9.0 (10/11/2026) a changé la commande `fetch` — elle lit désormais
# la config depuis un header `client-config` au lieu d'un argument, ce qui casse l'appel « fait
# main » invoke('plugin:http|fetch', { clientConfig }) de qlygoNative (app-poc.js) et du launcher
# -> erreur « missing client-config header », impossible d'ouvrir un dossier. 2.8.3 garde l'API
# par argument. (À dé-épingler le jour où qlygoNative/launcher passeront à la nouvelle API.)
tauri-plugin-http = "=2.8.3"
# Liens profonds « qlygocad://dossier/<n> » : le bouton QLYGO ouvre le bon dossier
tauri-plugin-deep-link = "2"
# Ouvre une URL dans le navigateur par defaut : sert aux TELECHARGEMENTS du Drive
# (archives .zip, fichiers). Le pont http transporte octet par octet, inadapte a
# une grosse archive ; on passe donc par un jeton SSO + le navigateur du systeme.
tauri-plugin-opener = "2"
# « Enregistrer sous » : boite de dialogue native, pour que le Drive n'ait JAMAIS
# besoin d'un navigateur pour telecharger un fichier (Quentin, 23/11/2026 :
# l'appli doit se suffire a elle-meme, et marcher pareil depuis n'importe quel PC).
tauri-plugin-dialog = "2"
# Telechargement HTTP ecrit DIRECTEMENT dans un fichier, cote Rust : pas de
# transfert octet par octet en JavaScript, donc utilisable sur de gros fichiers.
tauri-plugin-upload = "2"
# Requis par la macro generate_context!() dès qu'il y a une section "plugins" dans la config
serde_json = "1"

# Instance unique : indispensable pour que les liens profonds atteignent l'app DÉJÀ ouverte
# (sinon le n° de dossier n'est pas transmis -> retour à la base). Desktop uniquement.
[target."cfg(any(target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
# Binaire plus petit et plus rapide à distribuer.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
