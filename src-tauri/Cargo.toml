[package]
name = "qlygocad"
version = "1.1.36"
description = "QlygoCAD — CAO 2D pour l'urbanisme"
authors = ["QLYGO"]
edition = "2021"
rust-version = "1.77.2"

# Binaire unique (shell desktop). Tout le dessin vit côté web (engine/*).
[[bin]]
name = "qlygocad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Requêtes HTTP natives (contourne le CORS du navigateur) — login QLYGO
tauri-plugin-http = "2"
# Liens profonds « qlygocad://dossier/<n> » : le bouton QLYGO ouvre le bon dossier
tauri-plugin-deep-link = "2"
# Requis par la macro generate_context!() dès qu'il y a une section "plugins" dans la config
serde_json = "1"

# Instance unique : indispensable pour que les liens profonds atteignent l'app DÉJÀ ouverte
# (sinon le n° de dossier n'est pas transmis -> retour à la base). Desktop uniquement.
[target."cfg(any(target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
# Binaire plus petit et plus rapide à distribuer.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
