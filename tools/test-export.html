<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out">...</pre>
<script src="../engine/units.js"></script>
<script src="../engine/geometry.js"></script>
<script src="../engine/pdf.js"></script>
<script src="../engine/export.js"></script>
<script>
try{
  const G=QCAD.geometry, U=QCAD.units;
  const s=G.createScene();
  G.addRect(s,0,0,10000,8000,{penMm:0.5});
  const doc=QCAD.exportPdf(s,{scaleDenom:100,paper:'A4',orientation:'landscape',title:'test'});
  const bytes=doc.toBytes();              // chemin navigateur (Uint8Array)
  const head=String.fromCharCode.apply(null,bytes.slice(0,8));
  document.getElementById('out').textContent =
    'BROWSER-OK head='+head+' octets='+bytes.length+
    ' 10m@1:100='+U.realMmToPaperMm(10000,100)+'mm'+
    ' A4w='+U.mmToPt(210).toFixed(2)+'pt'+
    ' isUint8='+(bytes instanceof Uint8Array);
}catch(e){ document.getElementById('out').textContent='BROWSER-ERR '+e.message; }
</script></body></html>
